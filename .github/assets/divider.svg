<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="12" viewBox="0 0 1200 12" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff006e" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ff006e"/>
      <stop offset="0.5" stop-color="#00ffff"/>
      <stop offset="0.7" stop-color="#0080ff"/>
      <stop offset="1" stop-color="#0080ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect x="0" y="5" width="1200" height="2" fill="url(#g)" filter="url(#glow)"/>
  <rect x="0" y="5" width="1200" height="2" fill="url(#g)"/>
  <rect x="-120" y="4" width="120" height="4" fill="#fff" opacity="0.8" filter="url(#glow)">
    <animate attributeName="x" values="-120;1200" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
