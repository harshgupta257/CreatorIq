<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="CreatorIQ — Creator Intelligence Platform">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.55" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#2a0a3a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="0.5" stop-color="#ff10f0"/>
      <stop offset="0.8" stop-color="#ff006e"/>
      <stop offset="1" stop-color="#5d34d0"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.48" stop-color="#c0c0c0"/>
      <stop offset="0.52" stop-color="#6b6b80"/>
      <stop offset="1" stop-color="#e8e8ff"/>
    </linearGradient>
    <linearGradient id="story" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="0.5" stop-color="#ff006e"/>
      <stop offset="1" stop-color="#5d34d0"/>
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <mask id="sunStripes">
      <rect x="0" y="0" width="1200" height="440" fill="#fff"/>
      <rect x="0" y="196" width="1200" height="6" fill="#000"/>
      <rect x="0" y="212" width="1200" height="8" fill="#000"/>
      <rect x="0" y="230" width="1200" height="10" fill="#000"/>
      <rect x="0" y="250" width="1200" height="12" fill="#000"/>
    </mask>
    <clipPath id="horizon"><rect x="0" y="0" width="1200" height="270"/></clipPath>
    <clipPath id="floor"><rect x="0" y="270" width="1200" height="170"/></clipPath>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" y="3" fill="#000" opacity="0.35"/>
    </pattern>
    <style>
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', 'Courier New', monospace; }
      .title { font-size: 92px; font-weight: 800; letter-spacing: 6px; }
      .g1 { animation: g1 3.2s infinite steps(1); }
      .g2 { animation: g2 2.7s infinite steps(1); }
      .blink { animation: blink 1s infinite steps(1); }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      .flicker { animation: flicker 5s infinite; }
      @keyframes g1 { 0%,88%,100% { transform: translate(0,0); opacity: 0; } 89% { transform: translate(-6px,1px); opacity: .9; } 92% { transform: translate(4px,-2px); opacity: .9; } 95% { transform: translate(-3px,0); opacity: .9; } }
      @keyframes g2 { 0%,84%,100% { transform: translate(0,0); opacity: 0; } 85% { transform: translate(6px,-1px); opacity: .9; } 88% { transform: translate(-4px,2px); opacity: .9; } 91% { transform: translate(3px,0); opacity: .9; } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      @keyframes flicker { 0%,95%,100% { opacity: 1; } 96% { opacity: .7; } 97% { opacity: 1; } 98% { opacity: .8; } }
    </style>
  </defs>

  <!-- sky -->
  <rect width="1200" height="440" fill="url(#sky)"/>
  <g fill="#00ffff" opacity="0.6">
    <circle cx="90" cy="40" r="1.2"/><circle cx="210" cy="90" r="1"/><circle cx="330" cy="30" r="1.4"/>
    <circle cx="470" cy="70" r="1"/><circle cx="720" cy="35" r="1.2"/><circle cx="860" cy="85" r="1"/>
    <circle cx="1010" cy="45" r="1.4"/><circle cx="1130" cy="95" r="1"/><circle cx="640" cy="110" r="1"/>
  </g>

  <!-- sun -->
  <g clip-path="url(#horizon)">
    <circle cx="930" cy="200" r="150" fill="#ff10f0" opacity="0.35" filter="url(#softglow)"/>
    <circle cx="930" cy="200" r="130" fill="url(#sun)" mask="url(#sunStripes)"/>
  </g>

  <!-- perspective floor -->
  <g clip-path="url(#floor)" stroke="#ff006e" stroke-width="2" opacity="0.9">
    <line x1="600" y1="270" x2="-600" y2="440"/><line x1="600" y1="270" x2="-300" y2="440"/>
    <line x1="600" y1="270" x2="0" y2="440"/><line x1="600" y1="270" x2="200" y2="440"/>
    <line x1="600" y1="270" x2="400" y2="440"/><line x1="600" y1="270" x2="600" y2="440"/>
    <line x1="600" y1="270" x2="800" y2="440"/><line x1="600" y1="270" x2="1000" y2="440"/>
    <line x1="600" y1="270" x2="1200" y2="440"/><line x1="600" y1="270" x2="1500" y2="440"/>
    <line x1="600" y1="270" x2="1800" y2="440"/>
    <g>
      <line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="298" x2="1200" y2="298"/>
      <line x1="0" y1="324" x2="1200" y2="324"/><line x1="0" y1="360" x2="1200" y2="360"/>
      <line x1="0" y1="408" x2="1200" y2="408"/><line x1="0" y1="470" x2="1200" y2="470"/>
      <animateTransform attributeName="transform" type="translate" values="0 -10;0 0" dur="0.9s" repeatCount="indefinite"/>
    </g>
  </g>
  <rect x="0" y="270" width="1200" height="170" fill="url(#floorFade)"/>
  <line x1="0" y1="270" x2="1200" y2="270" stroke="#ff10f0" stroke-width="2" filter="url(#glow)"/>

  <!-- profile avatar with animated story ring -->
  <g transform="translate(120 150)">
    <circle r="62" fill="none" stroke="url(#story)" stroke-width="6"/>
    <circle r="54" fill="#05050c"/>
    <rect x="-26" y="-26" width="52" height="52" fill="none" stroke="#00ffff" stroke-width="3" filter="url(#glow)"/>
    <polyline points="-18,4 -8,4 -2,-12 6,16 12,0 18,0" fill="none" stroke="#00ffff" stroke-width="3" stroke-linejoin="round" filter="url(#glow)"/>
  </g>

  <!-- name + verified -->
  <g class="mono flicker">
    <g class="g1" style="mix-blend-mode:screen"><text x="210" y="138" class="title" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#ff006e">CREATORIQ</text></g>
    <g class="g2" style="mix-blend-mode:screen"><text x="210" y="138" class="title" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#00ffff">CREATORIQ</text></g>
    <text x="210" y="138" class="title" textLength="540" lengthAdjust="spacingAndGlyphs" fill="url(#silver)" filter="url(#glow)">CREATOR<tspan fill="#ff006e">IQ</tspan></text>
  </g>
  <g transform="translate(166 196)">
    <circle r="16" stroke="#05050c" stroke-width="4" fill="#0080ff" filter="url(#glow)"/>
    <polyline points="-7,0 -2,5 8,-6" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="214" y="176" class="mono" font-size="20" fill="#9aa4d6">@creatoriq <tspan fill="#6a6aa8">·</tspan> <tspan fill="#00ffff">creator intelligence platform</tspan><tspan class="blink" fill="#00ffff">_</tspan></text>

  <!-- live pill -->
  <g transform="translate(214 198)">
    <rect width="86" height="28" rx="14" fill="#ff006e"/>
    <circle cx="18" cy="14" r="5" fill="#fff" class="pulse"/>
    <text x="31" y="19" class="mono" font-size="14" font-weight="700" fill="#fff">LIVE</text>
  </g>
  <text x="314" y="218" class="mono" font-size="15" fill="#c0c0c0">insights · sentiment · rivals · trends</text>

  <!-- source chips -->
  <g class="mono" font-size="13" font-weight="700">
    <g transform="translate(214 240)">
      <rect width="104" height="26" fill="none" stroke="#00ffff" stroke-width="1.5"/><text x="12" y="18" fill="#00ffff">▶ YOUTUBE</text>
    </g>
    <g transform="translate(328 240)">
      <rect width="94" height="26" fill="none" stroke="#ff006e" stroke-width="1.5"/><text x="12" y="18" fill="#ff006e">● REDDIT</text>
    </g>
    <g transform="translate(432 240)">
      <rect width="96" height="26" fill="none" stroke="#ffd700" stroke-width="1.5"/><text x="12" y="18" fill="#ffd700">↗ TRENDS</text>
    </g>
    <g transform="translate(538 240)">
      <rect width="80" height="26" fill="none" stroke="#0080ff" stroke-width="1.5"/><text x="12" y="18" fill="#0080ff">≡ NEWS</text>
    </g>
  </g>

  <!-- floating "notification" cards -->
  <g class="mono">
    <g>
      <animateTransform attributeName="transform" type="translate" values="1010 300;1010 290;1010 300" dur="5s" repeatCount="indefinite"/>
      <rect width="160" height="58" fill="#05050c" fill-opacity="0.85" stroke="#00ffff" stroke-opacity="0.6"/>
      <text x="12" y="20" font-size="10" fill="#6a6aa8" letter-spacing="2">VIDEOS ANALYZED</text>
      <text x="12" y="44" font-size="20" font-weight="700" fill="#00ffff" filter="url(#glow)">UP TO 150</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="40 300;40 310;40 300" dur="6s" repeatCount="indefinite"/>
      <rect width="170" height="58" fill="#05050c" fill-opacity="0.85" stroke="#ff006e" stroke-opacity="0.6"/>
      <text x="12" y="20" font-size="10" fill="#6a6aa8" letter-spacing="2">RIVALS TRACKED</text>
      <text x="12" y="44" font-size="20" font-weight="700" fill="#ff006e" filter="url(#glow)">UP TO 3</text>
    </g>
  </g>

  <!-- CRT scanlines -->
  <rect width="1200" height="440" fill="url(#scan)" pointer-events="none"/>
</svg>
